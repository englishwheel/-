<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Halloween Articles: a / an / the</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Trebuchet MS', 'Segoe UI', Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,140,0,.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(138,43,226,.22), transparent 45%),
      #0d0a14;
    margin: 0;
    padding: 24px;
    color: #f3e9ff;
    min-height: 100vh;
  }

  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-decor span {
    position: absolute;
    opacity: .12;
    font-size: 42px;
    animation: float 9s ease-in-out infinite;
  }
  .bg-decor span:nth-child(1) { top: 8%;  left: 6%;  animation-delay: 0s; }
  .bg-decor span:nth-child(2) { top: 20%; right: 8%; animation-delay: 1.4s; font-size: 56px; }
  .bg-decor span:nth-child(3) { bottom: 12%; left: 12%; animation-delay: 2.6s; }
  .bg-decor span:nth-child(4) { bottom: 22%; right: 14%; animation-delay: .7s; font-size: 34px; }
  .bg-decor span:nth-child(5) { top: 46%; left: 3%;  animation-delay: 3.1s; font-size: 30px; }
  .bg-decor span:nth-child(6) { top: 60%; right: 4%;  animation-delay: 1.9s; font-size: 48px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-18px) rotate(4deg); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    background: linear-gradient(180deg, #1a1226 0%, #150f1f 100%);
    padding: 30px 34px 38px;
    border-radius: 16px;
    border: 1px solid rgba(255,140,0,.35);
    box-shadow:
      0 0 0 1px rgba(138,43,226,.25),
      0 10px 40px rgba(0,0,0,.6),
      0 0 60px rgba(255,140,0,.08);
  }

  h1 {
    font-size: 24px;
    margin: 0 0 6px;
    color: #ff9e2c;
    text-shadow: 0 0 14px rgba(255,140,0,.55);
    letter-spacing: .5px;
  }

  p.hint {
    color: #b9a8cc;
    font-size: 14px;
    margin: 0 0 18px;
    line-height: 1.5;
  }

  .item {
    margin: 10px 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(138,43,226,.15);
    transition: background .2s, border-color .2s;
  }
  .item:hover { background: rgba(255,140,0,.05); border-color: rgba(255,140,0,.3); }

  .sentence {
    font-size: 15px;
    line-height: 1.9;
    margin-bottom: 8px;
  }
  .num {
    display: inline-block;
    min-width: 26px;
    color: #ffb84d;
    font-weight: 700;
  }

  .answer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-left: 26px;
  }

  select {
    padding: 8px 12px;
    border: 1.5px solid #4a3a63;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    background: #0f0a17;
    color: #f3e9ff;
    cursor: pointer;
    min-width: 110px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  select:focus {
    border-color: #ff9e2c;
    box-shadow: 0 0 0 3px rgba(255,140,0,.18);
  }
  select.correct {
    border-color: #4cd964;
    background: rgba(76,217,100,.10);
    box-shadow: 0 0 10px rgba(76,217,100,.25);
  }
  select.wrong {
    border-color: #ff3b30;
    background: rgba(255,59,48,.12);
    box-shadow: 0 0 10px rgba(255,59,48,.3);
    animation: shake .3s;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-4px); }
    75%     { transform: translateX(4px); }
  }

  .mark { font-weight: 700; font-size: 17px; width: 20px; }
  .mark.ok  { color: #4cd964; text-shadow: 0 0 8px rgba(76,217,100,.7); }
  .mark.bad { color: #ff3b30; text-shadow: 0 0 8px rgba(255,59,48,.7); }

  .buttons {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: .4px;
    transition: transform .06s, box-shadow .2s, filter .2s;
  }
  button:active { transform: scale(.97); }

  #checkBtn {
    background: linear-gradient(180deg, #ff9e2c, #e67300);
    color: #1a0f00;
    box-shadow: 0 0 18px rgba(255,140,0,.5);
  }
  #checkBtn:hover { filter: brightness(1.1); box-shadow: 0 0 26px rgba(255,140,0,.75); }

  #resetBtn {
    background: linear-gradient(180deg, #7b4fbf, #5a2e9e);
    color: #f3e9ff;
    box-shadow: 0 0 16px rgba(138,43,226,.45);
  }
  #resetBtn:hover { filter: brightness(1.12); box-shadow: 0 0 24px rgba(138,43,226,.7); }

  #result {
    margin-top: 22px;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    display: none;
  }
  #result.pass {
    background: rgba(76,217,100,.12);
    color: #7dff9a;
    border: 1px solid rgba(76,217,100,.4);
    box-shadow: 0 0 22px rgba(76,217,100,.25);
  }
  #result.fail {
    background: rgba(255,59,48,.12);
    color: #ff8a80;
    border: 1px solid rgba(255,59,48,.4);
    box-shadow: 0 0 22px rgba(255,59,48,.25);
  }

  .web {
    position: absolute;
    top: -1px; right: -1px;
    width: 130px; height: 130px;
    opacity: .18;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="bg-decor">
  <span>🦇</span>
  <span>🎃</span>
  <span>🕸️</span>
  <span>👻</span>
  <span>🦇</span>
  <span>🎃</span>
</div>

<div class="container">
  <svg class="web" viewBox="0 0 100 100" fill="none" stroke="#d9b3ff" stroke-width="1">
    <path d="M100 0 L100 40 M100 0 L60 0 M100 0 L70 30 M100 0 L40 60 M100 0 L20 80"/>
    <path d="M100 15 Q85 15 80 30 M100 30 Q80 28 72 45 M100 45 Q75 42 60 62"/>
  </svg>

  <h1>🎃 Halloween Articles: a / an / the 🎃</h1>
  <p class="hint">Выберите правильный артикль (или «—», если артикль не нужен). <b>Тест сдан, если ошибок не больше 3.</b> Неправильные ответы загорятся зловещим красным. 👻</p>

  <div id="test"></div>

  <div class="buttons">
    <button id="checkBtn">🕸️ Проверить</button>
    <button id="resetBtn">💀 Сбросить</button>
  </div>
  <div id="result"></div>
</div>

<script>
/* ---------- ДАННЫЕ: 64 ВОПРОСА ---------- */
const questions = [
  { s: "___ Pacific is the largest and deepest ocean on Earth.", a: "the" },
  { s: "They crossed ___ Atlantic in a small boat.", a: "the" },
  { s: "___ Indian Ocean washes the shores of many countries.", a: "the" },
  { s: "We spent our summer on the coast of ___ Black Sea.", a: "the" },
  { s: "___ Mediterranean is famous for its mild climate.", a: "the" },
  { s: "Many ships have sunk in ___ Red Sea.", a: "the" },
  { s: "___ Alps are a popular destination for skiers.", a: "the" },
  { s: "They dreamed of climbing ___ Himalayas.", a: "the" },
  { s: "___ Urals separate Europe from Asia.", a: "the" },
  { s: "___ Everest is the highest mountain in the world.", a: "—" },
  { s: "We hiked to the top of ___ Mount Fuji.", a: "—" },
  { s: "___ Elbrus is located in the Caucasus.", a: "—" },
  { s: "___ Bahamas attract millions of tourists every year.", a: "the" },
  { s: "They sailed around ___ Canary Islands.", a: "the" },
  { s: "___ Philippines consist of more than 7,000 islands.", a: "the" },
  { s: "___ Madagascar is home to unique wildlife.", a: "—" },
  { s: "We flew to ___ Cyprus for a week.", a: "—" },
  { s: "___ Sicily is the largest island in the Mediterranean.", a: "—" },
  { s: "We visited ___ British Museum last weekend.", a: "the" },
  { s: "___ Louvre is the most visited museum in the world.", a: "the" },
  { s: "She works at ___ Hermitage in St Petersburg.", a: "the" },
  { s: "She plays ___ piano beautifully.", a: "the" },
  { s: "He learned to play ___ guitar when he was ten.", a: "the" },
  { s: "My sister is learning ___ violin.", a: "the" },
  { s: "They spent the afternoon playing ___ chess.", a: "the" },
  { s: "Let's play ___ tennis after lunch.", a: "—" },
  { s: "He is very good at ___ football.", a: "—" },
  { s: "___ Smiths are coming to dinner tonight.", a: "the" },
  { s: "___ Browns have lived here for generations.", a: "the" },
  { s: "I met ___ Johnsons at the party.", a: "the" },
  { s: "___ rich should help ___ poor.", a: "the" },
  { s: "We must take care of ___ elderly.", a: "the" },
  { s: "___ young are often full of energy.", a: "the" },
  { s: "They live on ___ Oxford Street.", a: "—" },
  { s: "We walked along ___ Fifth Avenue.", a: "—" },
  { s: "The shop is on ___ Baker Street.", a: "—" },
  { s: "We had a picnic in ___ Central Park.", a: "—" },
  { s: "___ Hyde Park is one of the largest parks in London.", a: "—" },
  { s: "They met in ___ Gorky Park yesterday.", a: "—" },
  { s: "___ sun rises in the east.", a: "the" },
  { s: "___ moon looks beautiful tonight.", a: "the" },
  { s: "___ Earth revolves around the Sun.", a: "the" },
  { s: "___ sky was clear and full of stars.", a: "the" },
  { s: "___ world is changing rapidly.", a: "the" },
  { s: "She is ___ honest person.", a: "an" },
  { s: "He is ___ university student.", a: "a" },
  { s: "I saw ___ elephant at the zoo.", a: "an" },
  { s: "We need ___ new car.", a: "a" },
  { s: "It took ___ hour to get there.", a: "an" },
  { s: "He is ___ European writer.", a: "a" },
  { s: "She bought ___ umbrella yesterday.", a: "an" },
  { s: "We go to ___ same school.", a: "the" },
  { s: "___ main reason for the delay was the weather.", a: "the" },
  { s: "You are not ___ right person for this job.", a: "the" },
  { s: "He gave me ___ wrong answer.", a: "the" },
  { s: "She is ___ only child in the family.", a: "an" },
  { s: "___ weather is terrible today.", a: "the" },
  { s: "He doesn't have ___ money to buy a car.", a: "—" },
  { s: "She gave me ___ good advice.", a: "—" },
  { s: "We had ___ great fun at the party.", a: "—" },
  { s: "It was ___ such good weather that we went for a walk.", a: "—" },
  { s: "___ what great work you have done!", a: "—" },
  { s: "I need ___ advice about my future.", a: "—" },
  { s: "___ money can't buy happiness.", a: "—" },
  { s: "We had ___ fun yesterday.", a: "—" },
  { s: "What ___ good weather we are having!", a: "—" }
];

/* ---------- НАСТРОЙКА ---------- */
const MAX_MISTAKES = 3; // допускается не более 3 ошибок

/* ---------- РЕНДЕР ---------- */
const testContainer = document.getElementById('test');
const options = ["—", "a", "an", "the"];

questions.forEach((q, i) => {
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `
    <div class="sentence">
      <span class="num">${i + 1}.</span> ${q.s}
    </div>
    <div class="answer-row">
      <select id="q${i}" data-answer="${q.a}">
        <option value="" disabled selected>— выберите —</option>
        ${options.map(o => `<option value="${o}">${o}</option>`).join('')}
      </select>
      <span class="mark" id="mark_q${i}"></span>
    </div>
  `;
  testContainer.appendChild(div);
});

/* ---------- ПРОВЕРКА ---------- */
function checkAll() {
  let correctCount = 0;
  let wrongCount = 0;
  let filledCount = 0;

  questions.forEach((q, i) => {
    const sel = document.getElementById('q' + i);
    const mark = document.getElementById('mark_q' + i);

    sel.classList.remove('correct', 'wrong');
    mark.textContent = '';
    mark.className = 'mark';

    if (sel.value === '') return;
    filledCount++;

    if (sel.value === q.a) {
      correctCount++;
      sel.classList.add('correct');
      mark.textContent = '✓';
      mark.classList.add('ok');
    } else {
      wrongCount++;
      sel.classList.add('wrong');
      mark.textContent = '✗';
      mark.classList.add('bad');
    }
  });

  const total = questions.length;
  const result = document.getElementById('result');
  result.style.display = 'block';

  const passed = (filledCount === total) && (wrongCount <= MAX_MISTAKES);

  if (passed) {
    result.className = 'pass';
    const errWord = wrongCount === 0 ? 'ни одной ошибки' : (wrongCount === 1 ? '1 ошибка' : `${wrongCount} ошибки`);
    result.textContent = `Тест сдан! ✅ Правильно: ${correctCount}/${total}, ${errWord} (допускается до ${MAX_MISTAKES}). 🎃👻🦇`;
  } else {
    result.className = 'fail';
    let msg = '';
    if (filledCount < total) {
      msg = `Заполнено ${filledCount} из ${total}. Ответьте на все вопросы. `;
    }
    msg += `Ошибок: ${wrongCount} (допускается не больше ${MAX_MISTAKES}). Исправьте красные поля и проверьте снова. 💀`;
    result.textContent = msg;
  }
}

/* ---------- СБРОС ---------- */
function resetAll() {
  questions.forEach((q, i) => {
    const sel = document.getElementById('q' + i);
    sel.value = '';
    sel.classList.remove('correct', 'wrong');
    const mark = document.getElementById('mark_q' + i);
    mark.textContent = '';
    mark.className = 'mark';
  });
  const result = document.getElementById('result');
  result.style.display = 'none';
  result.textContent = '';
  result.className = '';
}

document.getElementById('checkBtn').addEventListener('click', checkAll);
document.getElementById('resetBtn').addEventListener('click', resetAll);

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAll();
});
</script>
</body>
</html>
